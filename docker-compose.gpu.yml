# Opt-in GPU overlay, applied after docker-compose.local.yml on this workstation.
# Build first: docker build -f deploy/Dockerfile.gpu -t financekb-app:cu126 .
# Start: docker compose --env-file .env.local -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.gpu.yml up -d --no-deps --no-build app
services:
  app:
    image: financekb-app:cu126
    environment:
      RERANKER_DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
